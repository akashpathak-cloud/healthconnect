<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthConnect Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <style>
        /* Small compatibility layer for the recovered dashboard HTML.
           The existing dashboard.css remains the primary stylesheet. */

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fa;
            color: #123f63;
        }

        .topbar {
            background: #12476d;
            color: white;
            min-height: 92px;
            padding: 0 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .brand-subtitle {
            margin-top: 4px;
            font-size: 16px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 18px;
        }

        .logout-btn {
            background: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 6px;
            padding: 11px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .page {
            padding: 38px 32px 50px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 42px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 40px;
        }

        .page-header p {
            margin: 12px 0 0;
            font-size: 20px;
        }

        .date {
            font-size: 18px;
            padding-top: 12px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 34px;
        }

        .summary-card {
            background: white;
            border: 1px solid #d7e1e8;
            border-radius: 8px;
            padding: 28px;
        }

        .summary-card .label {
            font-size: 20px;
            color: #52626f;
        }

        .summary-card .number {
            margin-top: 14px;
            font-size: 38px;
            font-weight: 700;
            color: #123f63;
        }

        .studies-card {
            background: white;
            border: 1px solid #d7e1e8;
            border-radius: 8px;
            overflow: hidden;
        }

        .studies-header {
            padding: 24px 30px;
            border-bottom: 1px solid #d7e1e8;
        }

        .studies-header h2 {
            margin: 0;
            font-size: 28px;
        }

        .filters {
            display: flex;
            gap: 12px;
            padding: 18px 30px;
            border-bottom: 1px solid #d7e1e8;
        }

        .filters input,
        .filters select {
            padding: 10px 12px;
            border: 1px solid #bfcbd5;
            border-radius: 5px;
            font-size: 15px;
        }

        .filters input {
            flex: 1;
        }

        .filters button,
        .pagination button {
            padding: 10px 18px;
            border: 1px solid #2476c7;
            background: white;
            color: #1468b5;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f5f8fa;
            text-align: left;
            padding: 17px 18px;
            font-size: 15px;
        }

        td {
            padding: 18px;
            border-top: 1px solid #e4e9ed;
            font-size: 17px;
        }

        .priority,
        .status {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 6px;
            white-space: nowrap;
        }

        .priority.stat {
            color: #b00020;
            font-weight: 700;
        }

        .priority.urgent {
            color: #a65a00;
            font-weight: 700;
        }

        .priority.normal {
            color: #555;
        }

        .status.unread-status {
            background: #fce8e8;
            color: #b00020;
        }

        .status.review-status {
            background: #fff0c7;
            color: #9a6400;
        }

        .status.reported-status {
            background: #dff5e5;
            color: #087a43;
        }

        .view-btn {
            border: 1px solid #2476c7;
            background: white;
            color: #1468b5;
            border-radius: 5px;
            padding: 9px 20px;
            cursor: pointer;
        }

        .no-results {
            text-align: center;
            padding: 30px;
        }

        .table-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 30px;
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pagination button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        @media (max-width: 900px) {
            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .page {
                padding: 25px 15px;
                overflow-x: auto;
            }

            .topbar {
                padding: 0 18px;
            }

            table {
                min-width: 1000px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div>
        <div class="brand-title">HealthConnect</div>
        <div class="brand-subtitle">Clinical Imaging Portal</div>
    </div>

    <div class="user-area">
        <span>Radiologist</span>
        <strong>admin</strong>

        <button
            type="button"
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>
    </div>
</header>


<main class="page">

    <section class="page-header">
        <div>
            <h1>Radiology Worklist</h1>
            <p>Review and manage assigned imaging studies</p>
        </div>

        <div class="date">12 August 2026</div>
    </section>


    <section class="summary-grid">

        <div class="summary-card">
            <div class="label">Total Studies</div>
            <div class="number" id="totalCount">0</div>
        </div>

        <div class="summary-card">
            <div class="label">Unread</div>
            <div class="number" id="unreadCount">0</div>
        </div>

        <div class="summary-card">
            <div class="label">In Review</div>
            <div class="number" id="reviewCount">0</div>
        </div>

        <div class="summary-card">
            <div class="label">Reported</div>
            <div class="number" id="reportedCount">0</div>
        </div>

    </section>


    <section class="studies-card">

        <div class="studies-header">
            <h2>Today's Studies</h2>
        </div>


        <div class="filters">

            <input
                id="searchInput"
                type="text"
                placeholder="Search patient, MRN or study..."
            >

            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="Unread">Unread</option>
                <option value="In Review">In Review</option>
                <option value="Reported">Reported</option>
            </select>

            <select id="modalityFilter">
                <option value="all">All Modalities</option>
                <option value="CT">CT</option>
                <option value="MRI">MRI</option>
                <option value="X-Ray">X-Ray</option>
                <option value="Ultrasound">Ultrasound</option>
            </select>

            <button type="button" onclick="applyFilters()">
                Filter
            </button>

        </div>


        <table>

            <thead>
                <tr>
                    <th>Priority</th>
                    <th>Patient</th>
                    <th>MRN</th>
                    <th>Study</th>
                    <th>Modality</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Radiologist</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studyTableBody"></tbody>

        </table>


        <div class="table-footer">

            <span id="studyCount">0 studies</span>

            <div class="pagination">

                <button
                    id="previousBtn"
                    type="button"
                    onclick="previousPage()"
                >
                    Previous
                </button>

                <span id="pageInfo">Page 1 of 1</span>

                <button
                    id="nextBtn"
                    type="button"
                    onclick="nextPage()"
                >
                    Next
                </button>

            </div>

        </div>

    </section>

</main>


<script src="dashboard.js"></script>

</body>
</html>
