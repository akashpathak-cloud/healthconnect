<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HealthConnect Login</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


<div class="login-container">

    <h1>HealthConnect</h1>

    <h3>Clinical Imaging Portal</h3>


    <form id="loginForm">


        <label for="username">
            Username
        </label>


        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            autocomplete="username"
            required
        >


        <label for="password">
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >


        <div class="options">

            <label>

                <input
                    type="checkbox"
                    id="rememberMe"
                >

                Remember Me

            </label>


            <a
                href="#"
                onclick="return false;"
            >
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


        <p
            id="loginMessage"
            class="login-message"
        ></p>


    </form>


    <p class="footer">
        © 2026 HealthConnect
    </p>


</div>


<script>


const loginForm =
    document.getElementById("loginForm");


const loginButton =
    document.getElementById("loginButton");


const loginMessage =
    document.getElementById("loginMessage");


function showMessage(message, success = false) {

    loginMessage.textContent = message;

    loginMessage.style.display = "block";

    loginMessage.className =
        success
            ? "login-message success"
            : "login-message error";
}


/*
 * LOGIN
 */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        loginMessage.style.display =
            "none";


        try {

            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            username: username,

                            password: password
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                showMessage(
                    data.message ||
                    "Invalid username or password."
                );


                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Login";

                return;
            }


            showMessage(
                `Welcome ${data.user.username}`,
                true
            );


            setTimeout(
                function() {

                    window.location.href =
                        "/dashboard.html";

                },
                500
            );

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            showMessage(
                "Unable to connect to HealthConnect API."
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Login";
        }

    }
);


</script>


</body>

</html>
